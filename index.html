<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>abelhaKut</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-checking">
  <section id="authScreen" class="container">
    <div class="auth-card">
      <div class="logo">🐝 abelhaKut</div>
      <p class="subtitle">Sua rede social simples e divertida</p>

      <div id="loginBox">
        <input id="loginEmailInput" type="email" placeholder="E-mail" autocomplete="off" name="abelhakut-login-email" />
        <input id="loginSenhaInput" type="password" placeholder="Senha" autocomplete="new-password" name="abelhakut-login-senha" />

        <button onclick="login()">Entrar</button>
        <button class="link-btn" onclick="mostrarCadastro()">Ainda não é um membro abelhaKut?</button>
        <button class="link-btn" onclick="recuperarSenha()">Recuperar senha</button>
      </div>

      <div id="cadastroBox" class="hidden">
        <input id="cadastroNomeInput" placeholder="Nome" autocomplete="off" name="abelhakut-cadastro-nome" />
        <input id="cadastroEmailInput" type="email" placeholder="E-mail" autocomplete="off" name="abelhakut-cadastro-email" />
        <input id="cadastroSenhaInput" type="password" placeholder="Senha" autocomplete="new-password" name="abelhakut-cadastro-senha" />
        <input id="cadastroNascimentoInput" type="date" />

        <label style="display:flex; gap:8px; align-items:center; text-align:left; margin:8px 0 14px; color:#555; font-size:14px;">
          <input id="maior16Input" type="checkbox" style="width:auto; margin:0;" />
          Confirmo que sou maior de 16 anos
        </label>

        <button onclick="cadastrar()">Cadastrar</button>
        <button class="link-btn" onclick="mostrarLogin()">Voltar para login</button>
      </div>

      <p id="authStatus" class="status"></p>
    </div>
  </section>

  <section id="appScreen" class="app hidden">
    <header>
      <div class="brand-area">
        <h1>🐝 abelhaKut</h1>
      </div>

      <div class="top-search">
        <input id="pesquisaTopo" placeholder="Buscar pessoas no abelhaKut..." oninput="sincronizarPesquisaTopo()" />
      </div>

      <div class="header-actions">
        <button class="bell-btn" onclick="alternarNotificacoes()">🔔 <span id="bellCount" class="bell-count">0</span></button>
        <button class="bell-btn" onclick="alternarPainelAmigos()">👥</button>
        <button class="bell-btn" onclick="alternarPainelConversas()">💬 <span id="chatTopCount" class="bell-count">0</span></button>

        <div id="notificationsBox" class="notification-dropdown hidden"></div>
        <div id="friendsDropdown" class="top-dropdown hidden"></div>
        <div id="chatsDropdown" class="top-dropdown hidden"></div>

        <img id="minhaFotoTopo" class="top-photo" src="" alt="Minha foto" />
        <span id="meuNome"></span>
        <button onclick="sair()">Sair</button>
      </div>
    </header>

    <div class="main-layout">
      <div>
        <div class="panel profile-panel">
          <h3>Meu perfil</h3>

          <div class="profile-card-modern">
            <button class="profile-photo-button" onclick="abrirMenuFotoPerfil()" title="Abrir foto de perfil">
              <img id="minhaFotoPerfil" src="" alt="Minha foto de perfil" />
              <span>Alterar foto</span>
            </button>

            <div class="profile-info-modern">
              <strong id="meuNomePerfil">Meu perfil</strong>
              <small>Clique na foto para ver ou trocar</small>
            </div>
          </div>

          <input id="fotoArquivo" type="file" accept="image/*" onchange="atualizarFotoPerfil(event)" hidden />
          <p id="fotoStatus" class="status"></p>

          <div class="profile-bio-box">
            <div class="bio-title-row">
              <h4>Minha bio</h4>
              <small><span id="bioCount">0</span>/160</small>
            </div>

            <textarea id="bioInput" maxlength="160" placeholder="Escreva uma bio curta com emojis 🐝" oninput="atualizarContadorBio()"></textarea>
            <button class="save-bio-btn" onclick="salvarBio()">Salvar bio</button>
            <p id="bioStatus" class="status"></p>
          </div>
        </div>


        <div id="chatPanel" class="panel chat-panel hidden">
          <div class="chat-user">
            <img id="chatFoto" src="" alt="Foto do amigo" />
            <div>
              <h3 id="chatNome"></h3>
              <p id="chatStatusLinha">Status desconhecido</p>
            </div>
            <button class="minimize-chat-btn" onclick="minimizarChat()">—</button>
            <button class="close-chat-btn" onclick="fecharChat()">×</button>
          </div>

          <div id="messages" class="messages"></div>
          <div id="typingStatus" class="typing"></div>

          <div id="emojiPicker" class="emoji-picker hidden">
            <button onclick="adicionarEmoji('😀')">😀</button>
            <button onclick="adicionarEmoji('😂')">😂</button>
            <button onclick="adicionarEmoji('😍')">😍</button>
            <button onclick="adicionarEmoji('😎')">😎</button>
            <button onclick="adicionarEmoji('😭')">😭</button>
            <button onclick="adicionarEmoji('🔥')">🔥</button>
            <button onclick="adicionarEmoji('❤️')">❤️</button>
            <button onclick="adicionarEmoji('🐝')">🐝</button>
            <button onclick="adicionarEmoji('👍')">👍</button>
            <button onclick="adicionarEmoji('👏')">👏</button>
          </div>

          <div class="chat-input">
            <button class="emoji-btn" onclick="alternarEmojiPicker()">😊</button>
            <input id="messageInput" placeholder="Digite sua mensagem..." autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" name="abelhakut-message-input" oninput="marcarDigitando()" onkeydown="if(event.key === 'Enter') enviarMensagem()" />
            <button class="send-btn" onclick="enviarMensagem()">➤</button>
          </div>
        </div>

        <div id="chatMinimizedBar" class="chat-minimized-bar hidden" onclick="restaurarChat()">
          <img id="chatMinFoto" src="" alt="Foto do chat" />
          <div>
            <strong id="chatMinNome">Chat</strong>
            <small>Clique para abrir a conversa</small>
          </div>
        </div>
      </div>

      <main class="feed-main">
        <section class="panel create-post-card">
          <div class="create-post-top">
            <img id="postMinhaFoto" src="" alt="Minha foto" />
            <textarea id="postTextoInput" maxlength="600" placeholder="No que você está pensando?"></textarea>
          </div>

          <div id="postPreviewBox" class="post-preview-box hidden">
            <button class="remove-post-image" onclick="removerImagemPost()">×</button>
            <img id="postPreviewImg" src="" alt="Prévia da imagem" />
          </div>

          <div id="postEmojiPicker" class="post-emoji-picker hidden">
            <button onclick="adicionarEmojiPost('😀')">😀</button>
            <button onclick="adicionarEmojiPost('😂')">😂</button>
            <button onclick="adicionarEmojiPost('😍')">😍</button>
            <button onclick="adicionarEmojiPost('😎')">😎</button>
            <button onclick="adicionarEmojiPost('🔥')">🔥</button>
            <button onclick="adicionarEmojiPost('❤️')">❤️</button>
            <button onclick="adicionarEmojiPost('🐝')">🐝</button>
            <button onclick="adicionarEmojiPost('🍯')">🍯</button>
            <button onclick="adicionarEmojiPost('👏')">👏</button>
            <button onclick="adicionarEmojiPost('👍')">👍</button>
          </div>

          <div class="create-post-actions">
            <input id="postImagemInput" type="file" accept="image/*" onchange="selecionarImagemPost(event)" hidden />
            <button onclick="document.getElementById('postImagemInput').click()">📷 Foto</button>
            <button onclick="alternarEmojiPost()">😊 Emoji</button>
            <button class="publish-post-btn" onclick="publicarPost()">Publicar</button>
          </div>

          <p id="postStatus" class="status"></p>
        </section>

        <section id="feedPosts" class="feed-posts">
          <div class="panel feed-empty">
            <div class="feed-icon">🐝</div>
            <h2>Carregando feed...</h2>
          </div>
        </section>
      </main>
    </div>
  </section>

  <div id="fotoPerfilModal" class="photo-modal hidden">
    <div class="photo-modal-card">
      <button class="photo-modal-close" onclick="fecharMenuFotoPerfil()">×</button>
      <img id="fotoPerfilModalImg" src="" alt="Foto de perfil ampliada" />
      <div class="photo-modal-actions">
        <button onclick="verFotoCompleta()">Ver foto completa</button>
        <button onclick="escolherNovaFoto()">Fazer upload</button>
      </div>
    </div>
  </div>

  <div id="onlineToastContainer" class="online-toast-container"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
