<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>abelhaKut</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fff3b0, #ffd166, #f7a800);
      color: #2b2b2b;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      text-align: center;
    }

    .logo {
      font-size: 38px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #cf7d00;
    }

    .subtitle {
      margin-bottom: 24px;
      color: #666;
    }

    input, button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #ddd;
      margin-bottom: 12px;
      font-size: 15px;
    }

    button {
      cursor: pointer;
      border: none;
      font-weight: bold;
      background: #f7a800;
      color: white;
      transition: 0.2s;
    }

    button:hover {
      background: #d98f00;
    }

    .link-btn {
      background: transparent;
      color: #cf7d00;
      padding: 4px;
      margin: 4px 0;
    }

    .app {
      min-height: 100vh;
      padding: 20px;
    }

    header {
      max-width: 1100px;
      margin: 0 auto 20px auto;
      background: #fff;
      padding: 18px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      gap: 12px;
    }

    header h1 {
      color: #cf7d00;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .header-actions button {
      width: auto;
      margin: 0;
      padding: 10px 14px;
    }

    .top-photo {
      width: 36px;
      height: 48px;
      border-radius: 6px;
      object-fit: cover;
      background: #eee;
      border: 2px solid #ffd166;
    }

    .main-layout {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
    }

    .panel {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .search-box {
      margin-bottom: 14px;
      max-width: 360px;
    }

    .friends-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .bell-btn {
      position: relative;
      width: auto;
      padding: 9px 12px;
      margin: 0;
      border-radius: 999px;
      background: #fff3b0;
      color: #8a5a00;
      border: 1px solid #ffd166;
    }

    .bell-count {
      position: absolute;
      top: -7px;
      right: -7px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 999px;
      background: #e63946;
      color: #fff;
      font-size: 12px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .notification-box {
      margin-top: 12px;
      border-top: 1px solid #eee;
      padding-top: 12px;
    }

    .notification-item {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }

    .notification-item img {
      width: 44px;
      height: 56px;
      border-radius: 7px;
      object-fit: cover;
      background: #eee;
    }

    .notification-actions {
      display: flex;
      gap: 6px;
      margin-top: 7px;
      flex-wrap: wrap;
    }

    .notification-actions button {
      width: auto;
      padding: 6px 8px;
      margin: 0;
      font-size: 12px;
    }

    .deny-btn, .block-btn {
      background: #777;
    }

    .block-btn {
      background: #d62828;
    }

    .friends-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      min-height: 330px;
    }

    .friend-card {
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      background: #fffaf0;
      transition: 0.2s;
    }

    .friend-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.12);
    }

    .friend-card img {
      width: 78px;
      height: 98px;
      border-radius: 8px;
      object-fit: cover;
      background: #eee;
      margin-bottom: 8px;
    }

    .friend-card p {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
      color: #8a5a00;
    }

    .pagination {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }

    .pagination button {
      margin: 0;
    }

    .add-area h3,
    .chat-panel h3,
    .profile-panel h3 {
      margin-bottom: 12px;
      color: #cf7d00;
    }

    .profile-panel {
      margin-bottom: 20px;
    }

    .profile-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .profile-row img {
      width: 70px;
      height: 90px;
      border-radius: 8px;
      object-fit: cover;
      background: #eee;
    }

    .upload-label {
      display: inline-block;
      margin: 8px 0;
      padding: 9px 12px;
      border-radius: 10px;
      background: #f7a800;
      color: white;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
    }

    .profile-row small {
      display: block;
      color: #777;
      font-size: 12px;
    }

    .result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }

    .result-item img {
      width: 45px;
      height: 55px;
      border-radius: 6px;
      object-fit: cover;
    }

    .result-item button {
      width: auto;
      margin: 0;
      padding: 8px 10px;
      font-size: 13px;
    }

    .chat-panel {
      margin-top: 20px;
    }

    .chat-user {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }

    .chat-user img {
      width: 60px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
      background: #eee;
    }

    .messages {
      height: 310px;
      overflow-y: auto;
      background: #fffaf0;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid #f0dfb8;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      margin-bottom: 12px;
      animation: msgIn 0.22s ease;
    }

    .message-row.mine-row {
      justify-content: flex-end;
    }

    .message-row.theirs-row {
      justify-content: flex-start;
    }

    .msg-avatar {
      width: 30px;
      height: 38px;
      border-radius: 7px;
      object-fit: cover;
      background: #eee;
      border: 1px solid #ffd166;
      flex-shrink: 0;
    }

    .message {
      max-width: 72%;
      padding: 10px 12px;
      border-radius: 18px;
      font-size: 14px;
      word-wrap: break-word;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      line-height: 1.35;
    }

    .mine {
      background: linear-gradient(135deg, #f7a800, #ffbf2f);
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .theirs {
      background: #fff;
      color: #333;
      border: 1px solid #eee;
      border-bottom-left-radius: 5px;
    }

    .message small {
      display: block;
      margin-top: 4px;
      font-size: 9px;
      opacity: 0.65;
      text-align: right;
    }

    .delete-msg {
      width: auto;
      background: rgba(0, 0, 0, 0.18);
      padding: 3px 7px;
      margin-top: 5px;
      font-size: 10px;
      border-radius: 999px;
    }

    .typing {
      height: 18px;
      font-size: 13px;
      color: #777;
      margin-bottom: 8px;
      font-style: italic;
    }

    .emoji-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: white;
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 8px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
    }

    .emoji-picker button {
      width: auto;
      margin: 0;
      padding: 7px 9px;
      background: #fffaf0;
      color: #333;
      font-size: 18px;
    }

    .chat-input {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #fffaf0;
      border: 1px solid #f0dfb8;
      border-radius: 999px;
      padding: 6px;
    }

    .chat-input input {
      margin: 0;
      border: none;
      background: transparent;
      outline: none;
      flex: 1;
    }

    .chat-input button {
      width: auto;
      margin: 0;
      border-radius: 999px;
      padding: 10px 13px;
    }

    .emoji-btn {
      background: #fff3b0;
      color: #8a5a00;
      border: 1px solid #ffd166;
    }

    .send-btn {
      width: 46px !important;
      height: 42px;
      padding: 0 !important;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes msgIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .status {
      font-size: 14px;
      margin-top: 8px;
      color: #555;
      min-height: 18px;
    }

    @media (max-width: 900px) {
      .main-layout {
        grid-template-columns: 1fr;
      }

      .friends-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }


    /* ===== Layout reorganizado ===== */
    .app {
      padding: 14px;
    }

    header {
      max-width: 1180px;
      position: sticky;
      top: 10px;
      z-index: 50;
      margin-bottom: 18px;
      padding: 12px 16px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-area h1 {
      font-size: 24px;
      white-space: nowrap;
    }

    .top-search {
      flex: 1;
      max-width: 420px;
      margin: 0 12px;
    }

    .top-search input {
      margin: 0;
      border-radius: 999px;
      background: #fffaf0;
      border: 1px solid #f0dfb8;
    }

    .header-actions {
      position: relative;
    }

    .notification-dropdown {
      position: absolute;
      top: 58px;
      right: 0;
      width: min(360px, calc(100vw - 32px));
      max-height: 430px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #f0dfb8;
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 16px 35px rgba(0,0,0,0.18);
      z-index: 80;
    }

    .notification-section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #9a6400;
      margin: 6px 0;
    }

    .main-layout {
      max-width: 1180px;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 560px);
      align-items: start;
    }

    .friends-panel {
      width: 100%;
      max-width: 560px;
      justify-self: end;
      padding: 16px;
    }

    .profile-panel {
      padding: 16px;
    }

    .profile-row img {
      width: 58px;
      height: 74px;
    }

    .friends-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      min-height: 170px;
    }

    .friend-card {
      padding: 8px;
      border-radius: 14px;
      cursor: default;
    }

    .friend-card img {
      width: 48px;
      height: 60px;
      margin-bottom: 5px;
    }

    .friend-card p {
      font-size: 12px;
      min-height: 28px;
      line-height: 1.15;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-wrap: anywhere;
    }

    .friend-actions {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }

    .friend-actions button {
      margin: 0;
      padding: 6px 7px;
      font-size: 11px;
      border-radius: 999px;
    }

    .remove-friend-btn {
      background: #fff3b0;
      color: #8a5a00;
      border: 1px solid #ffd166;
    }

    #chatPanel.chat-panel {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: min(390px, calc(100vw - 28px));
      max-height: calc(100vh - 100px);
      margin: 0;
      padding: 0;
      overflow: hidden;
      z-index: 70;
      border-radius: 22px;
      animation: chatPop .22s ease;
    }

    .chat-user {
      margin: 0;
      padding: 12px 14px;
      background: linear-gradient(135deg, #f7a800, #ffbf2f);
      color: #fff;
      border-bottom: none;
    }

    .chat-user img {
      width: 44px;
      height: 56px;
      border: 2px solid rgba(255,255,255,.6);
    }

    .chat-user h3 {
      color: #fff;
      margin-bottom: 2px;
    }

    .chat-user p {
      font-size: 12px;
      opacity: .9;
    }

    .close-chat-btn {
      width: 34px !important;
      height: 34px;
      margin: 0 0 0 auto !important;
      padding: 0 !important;
      border-radius: 999px;
      background: rgba(255,255,255,.25);
      color: #fff;
      font-size: 18px;
    }

    #chatPanel .messages {
      height: 315px;
      border: none;
      border-radius: 0;
      margin: 0;
    }

    #chatPanel .typing {
      padding: 0 14px;
    }

    #chatPanel .emoji-picker {
      margin: 0 12px 8px;
    }

    #chatPanel .chat-input {
      margin: 0 12px 12px;
    }

    @keyframes chatPop {
      from { opacity: 0; transform: translateY(16px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 760px) {
      header {
        flex-wrap: wrap;
        top: 0;
        border-radius: 0 0 18px 18px;
      }

      .top-search {
        order: 3;
        max-width: none;
        width: 100%;
        margin: 8px 0 0;
      }

      .main-layout {
        grid-template-columns: 1fr;
      }

      .friends-panel {
        max-width: none;
      }

      .friends-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

  </style>
</head>
<body>
  <section id="authScreen" class="container">
    <div class="auth-card">
      <div class="logo">🐝 abelhaKut</div>
      <p class="subtitle">Sua rede social simples e divertida</p>

      <div id="loginBox">
        <input id="loginEmailInput" type="email" placeholder="E-mail" />
        <input id="loginSenhaInput" type="password" placeholder="Senha" />

        <button onclick="login()">Entrar</button>
        <button class="link-btn" onclick="mostrarCadastro()">Ainda não é um membro abelhaKut?</button>
        <button class="link-btn" onclick="recuperarSenha()">Recuperar senha</button>
      </div>

      <div id="cadastroBox" class="hidden">
        <input id="cadastroNomeInput" placeholder="Nome" />
        <input id="cadastroEmailInput" type="email" placeholder="E-mail" />
        <input id="cadastroSenhaInput" type="password" placeholder="Senha" />
        <input id="cadastroNascimentoInput" type="date" />

        <label style="display:flex; gap:8px; align-items:center; text-align:left; margin:8px 0 14px; color:#555; font-size:14px;">
          <input id="maior16Input" type="checkbox" style="width:auto; margin:0;" />
          Confirmo que sou maior de 16 anos
        </label>

        <button onclick="cadastrar()">Cadastrar</button>
        <button class="link-btn" onclick="mostrarLogin()">Voltar para login</button>
      </div>

      <p id="authStatus" class="status"></p>
    </div>
  </section>

  <section id="appScreen" class="app hidden">
    <header>
      <div class="brand-area">
        <h1>🐝 abelhaKut</h1>
      </div>

      <div class="top-search">
        <input id="pesquisaTopo" placeholder="Buscar pessoas no abelhaKut..." oninput="sincronizarPesquisaTopo()" />
      </div>

      <div class="header-actions">
        <button class="bell-btn" onclick="alternarNotificacoes()">🔔 <span id="bellCount" class="bell-count">0</span></button>
        <div id="notificationsBox" class="notification-dropdown hidden"></div>
        <img id="minhaFotoTopo" class="top-photo" src="" alt="Minha foto" />
        <span id="meuNome"></span>
        <button onclick="sair()">Sair</button>
      </div>
    </header>

    <div class="main-layout">
      <div>
        <div class="panel profile-panel">
          <h3>Meu perfil</h3>
          <div class="profile-row">
            <img id="minhaFotoPerfil" src="" alt="Minha foto de perfil" />
            <div>
              <p>Foto de perfil</p>
              <label class="upload-label" for="fotoArquivo">Enviar foto do computador</label>
              <input id="fotoArquivo" type="file" accept="image/*" onchange="atualizarFotoPerfil(event)" hidden />
              <small>Use uma imagem pequena para carregar melhor.</small>
            </div>
          </div>
          <p id="fotoStatus" class="status"></p>
        </div>


        <div id="chatPanel" class="panel chat-panel hidden">
          <div class="chat-user">
            <img id="chatFoto" src="" alt="Foto do amigo" />
            <div>
              <h3 id="chatNome"></h3>
              <p>Chat em tempo real</p>
            </div>
            <button class="close-chat-btn" onclick="fecharChat()">×</button>
          </div>

          <div id="messages" class="messages"></div>
          <div id="typingStatus" class="typing"></div>

          <div id="emojiPicker" class="emoji-picker hidden">
            <button onclick="adicionarEmoji('😀')">😀</button>
            <button onclick="adicionarEmoji('😂')">😂</button>
            <button onclick="adicionarEmoji('😍')">😍</button>
            <button onclick="adicionarEmoji('😎')">😎</button>
            <button onclick="adicionarEmoji('😭')">😭</button>
            <button onclick="adicionarEmoji('🔥')">🔥</button>
            <button onclick="adicionarEmoji('❤️')">❤️</button>
            <button onclick="adicionarEmoji('🐝')">🐝</button>
            <button onclick="adicionarEmoji('👍')">👍</button>
            <button onclick="adicionarEmoji('👏')">👏</button>
          </div>

          <div class="chat-input">
            <button class="emoji-btn" onclick="alternarEmojiPicker()">😊</button>
            <input id="messageInput" placeholder="Digite sua mensagem..." oninput="marcarDigitando()" onkeydown="if(event.key === 'Enter') enviarMensagem()" />
            <button class="send-btn" onclick="enviarMensagem()">➤</button>
          </div>
        </div>
      </div>

      <div class="panel friends-panel">
        <div class="friends-title-row">
          <h2>Meus amigos</h2>
        </div>
        <input id="pesquisaAmigos" class="search-box" placeholder="Pesquisar amigos..." oninput="pesquisarUsuarios()" />
        <div id="searchResults"></div>
        <br />
        <div id="friendsGrid" class="friends-grid"></div>

        <div class="pagination">
          <button onclick="paginaAnterior()">← Anterior</button>
          <button onclick="proximaPagina()">Próxima →</button>
        </div>
      </div>
    </div>
  </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      sendEmailVerification,
      applyActionCode,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      updateDoc,
      collection,
      query,
      where,
      getDocs,
      addDoc,
      deleteDoc,
      serverTimestamp,
      arrayUnion,
      arrayRemove,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Configuração do Firebase do projeto abelhaKut
    const firebaseConfig = {
      apiKey: "AIzaSyCuNKXST-CCpDvlTtu3QX7FDgNxT5A7Kt0",
      authDomain: "abelhakut.firebaseapp.com",
      projectId: "abelhakut",
      storageBucket: "abelhakut.firebasestorage.app",
      messagingSenderId: "579128790046",
      appId: "1:579128790046:web:a60317ff1c1526fb80320f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let usuarioAtual = null;
    let dadosUsuario = null;
    let amigos = [];
    let paginaAtual = 0;
    let amigoChat = null;
    let chatIdAtual = null;
    let unsubscribeMessages = null;
    let unsubscribeTyping = null;
    let unsubscribeUsuario = null;
    let typingTimer = null;

    const placeholderFoto = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`
      <svg xmlns='http://www.w3.org/2000/svg' width='90' height='120'>
        <rect width='100%' height='100%' fill='#fff3b0'/>

      ]);

      const senha = loginSenhaInput.value.trim();

      if (!email || !senha) {
        authStatus.textContent = "Preencha o e-mail e a senha.";
        return;
      }

      authStatus.textContent = "Entrando...";

      try {
        const cred = await signInWithEmailAndPassword(auth, email, senha);
        await cred.user.reload();

        if (!cred.user.emailVerified) {
          await signOut(auth);
          authStatus.textContent = "Confirme seu email antes de entrar. Veja o link que enviamos para sua caixa de entrada.";
          return;
        }

        authStatus.textContent = "";
      } catch (error) {
        authStatus.textContent = "E-mail ou senha incorretos. Verifique os dados ou crie uma conta no abelhaKut.";
      }
    };

    window.cadastrar = async function () {
      const nome = cadastroNomeInput.value.trim();
      const email = cadastroEmailInput.value.trim();
      const senha = cadastroSenhaInput.value.trim();
      const nascimento = cadastroNascimentoInput.value;
      const maior16 = maior16Input.checked;
      const foto = placeholderFoto;

      if (!nome || !email || !senha || !nascimento) {
        authStatus.textContent = "Preencha nome, email, senha e data de nascimento.";
        return;
      }

      if (!maior16) {
        authStatus.textContent = "Para cadastrar, confirme que você é maior de 16 anos.";
        return;
      }

      if (senha.length < 6) {
        authStatus.textContent = "A senha precisa ter pelo menos 6 caracteres.";
        return;
      }

      authStatus.textContent = "Criando conta...";

      try {
        const cred = await esperarComTempoLimite(
          createUserWithEmailAndPassword(auth, email, senha),
          15,
          "O Firebase demorou para criar a conta. Confira sua internet e tente novamente."
        );

        authStatus.textContent = "Conta criada. Enviando link de confirmação...";

        await esperarComTempoLimite(
          sendEmailVerification(cred.user),
          15,
          "A conta foi criada, mas o envio do link demorou demais. Tente recuperar/reenviar depois."
        );

        authStatus.textContent = "Salvando seu perfil...";

        try {
          await esperarComTempoLimite(
            setDoc(doc(db, "users", cred.user.uid), {
              uid: cred.user.uid,
              nome,
              email,
              nascimento,
              maior16,
              foto,
              amigos: [],
              solicitacoesRecebidas: [],
              solicitacoesEnviadas: [],
              bloqueados: [],
              unreadChats: [],
              criadoEm: serverTimestamp()
            }),
            15,
            "O perfil demorou para salvar no banco de dados."
          );
        } catch (erroBanco) {
          console.error("Erro ao salvar perfil:", erroBanco);
        }

        await signOut(auth);
        mostrarLogin();
        authStatus.textContent =
          "Enviamos um link de confirmação para seu email. Clique no link para autenticar sua conta antes de entrar.";
      } catch (error) {
        console.error("Erro no cadastro:", error);

        if (error.code === "auth/email-already-in-use") {
          try {
            const loginExistente = await signInWithEmailAndPassword(auth, email, senha);
            await loginExistente.user.reload();

            if (!loginExistente.user.emailVerified) {
              await sendEmailVerification(loginExistente.user);

              await signOut(auth);
              mostrarLogin();
              authStatus.textContent =
                "Esse email já estava cadastrado, mas ainda não confirmado. Enviamos um novo link de confirmação para seu email.";
              return;
            }

            await signOut(auth);
            mostrarLogin();
            authStatus.textContent =
              "Este email já está cadastrado e confirmado. Entre usando seu email e senha.";
            return;
          } catch (erroLoginExistente) {
            authStatus.textContent =
              "Este email já está cadastrado no abelhaKut. Tente entrar ou recuperar sua senha.";
            return;
          }
        }

        if (error.code === "auth/invalid-email") {
          authStatus.textContent = "Digite um email válido.";
          return;
        }

        if (error.code === "auth/weak-password") {
          authStatus.textContent = "A senha precisa ter pelo menos 6 caracteres.";
          return;
        }

        if (error.code === "auth/network-request-failed") {
          authStatus.textContent = "Falha de internet. Verifique sua conexão e tente novamente.";
          return;
        }

        if (error.code === "auth/unauthorized-continue-uri" || String(error.message || "").includes("error-code:-26")) {
          authStatus.textContent =
            "O Firebase bloqueou a URL do link de confirmação. Agora o código usa o envio padrão. Apague a conta criada sem confirmação e tente cadastrar novamente.";
          return;
        }

        authStatus.textContent =
          "Não foi possível criar sua conta agora. Erro: " + (error.message || error);
      }
    };

    function reduzirImagemParaBase64(arquivo) {
      return new Promise((resolve, reject) => {
        const leitor = new FileReader();

        leitor.onload = () => {
          const img = new Image();

          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxLargura = 300;
            const maxAltura = 400;
            let largura = img.width;
            let altura = img.height;

            const proporcao = Math.min(maxLargura / largura, maxAltura / altura, 1);
            largura = Math.round(largura * proporcao);
            altura = Math.round(altura * proporcao);

            canvas.width = largura;
            canvas.height = altura;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, largura, altura);

            resolve(canvas.toDataURL("image/jpeg", 0.75));
          };

          img.onerror = reject;
          img.src = leitor.result;
        };

        leitor.onerror = reject;
        leitor.readAsDataURL(arquivo);
      });
    }

    async function renderizarNotificacoes() {
      if (!dadosUsuario) return;

      const recebidas = dadosUsuario.solicitacoesRecebidas || [];
      const unreadChats = dadosUsuario.unreadChats || [];
      const total = recebidas.length + unreadChats.length;

      bellCount.textContent = total;
      bellCount.style.display = total > 0 ? "flex" : "none";
      notificationsBox.innerHTML = "";

      if (total === 0) {
        notificationsBox.innerHTML = "<p class='status'>Nenhuma notificação agora.</p>";
        return;
      }

      if (recebidas.length > 0) {
        const title = document.createElement("div");
        title.className = "notification-section-title";
        title.textContent = "Solicitações de amizade";
        notificationsBox.appendChild(title);
      }

      for (const id of recebidas) {
        const snap = await getDoc(doc(db, "users", id));
        if (!snap.exists()) continue;
        const pessoa = snap.data();
        const item = document.createElement("div");
        item.className = "notification-item";
        item.innerHTML = `
          <img src="${pessoa.foto || placeholderFoto}" />
          <div>
            <strong>${pessoa.nome}</strong><br />
            <small>enviou uma solicitação de amizade</small>
            <div class="notification-actions">
              <button onclick="aceitarSolicitacao('${pessoa.uid}')">Aceitar</button>
              <button class="deny-btn" onclick="negarSolicitacao('${pessoa.uid}')">Negar</button>
              <button class="block-btn" onclick="bloquearPessoa('${pessoa.uid}')">Bloquear</button>
            </div>
          </div>
        `;
        notificationsBox.appendChild(item);
      }

      if (unreadChats.length > 0) {
        const title = document.createElement("div");
        title.className = "notification-section-title";
        title.textContent = "Mensagens não lidas";
        notificationsBox.appendChild(title);
      }

      for (const chatId of unreadChats) {
        const outroId = chatId.split("_").find((id) => id !== usuarioAtual.uid);
        if (!outroId) continue;

        const snap = await getDoc(doc(db, "users", outroId));
        if (!snap.exists()) continue;
        const pessoa = snap.data();

        const item = document.createElement("div");
        item.className = "notification-item";
        item.innerHTML = `
          <img src="${pessoa.foto || placeholderFoto}" />
          <div>
            <strong>${pessoa.nome}</strong><br />
            <small>mandou uma nova mensagem</small>
            <div class="notification-actions">
              <button onclick="abrirChatPorId('${pessoa.uid}')">Abrir chat</button>
            </div>
          </div>
        `;
        notificationsBox.appendChild(item);
      }

    async function carregarAmigos() {
      amigos = [];
      const ids = [...new Set(dadosUsuario.amigos || [])];

      for (const id of ids) {
        const amigoSnap = await getDoc(doc(db, "users", id));
        if (amigoSnap.exists()) {
          const amigoData = amigoSnap.data();
          if (!amigos.some((a) => a.uid === amigoData.uid)) {
            amigos.push(amigoData);
          }
        }
      }

      if (paginaAtual > 0 && paginaAtual * 9 >= amigos.length) {
        paginaAtual = Math.max(0, Math.ceil(amigos.length / 9) - 1);
      }

      renderizarAmigos();
    }

    function renderizarAmigos() {
      friendsGrid.innerHTML = "";

      const inicio = paginaAtual * 9;
      const fim = inicio + 9;
      const amigosPagina = amigos.slice(inicio, fim);

      if (amigosPagina.length === 0) {
        friendsGrid.innerHTML = "<p>Você ainda não adicionou amigos.</p>";
        return;
      }

      amigosPagina.forEach((amigo) => {
        const card = document.createElement("div");
        card.className = "friend-card";
        card.innerHTML = `
          <img src="${amigo.foto || placeholderFoto}" />
          <p>${amigo.nome}</p>
          <div class="friend-actions">
            <button onclick="abrirChatPorId('${amigo.uid}')">💬 Chat</button>
            <button class="remove-friend-btn" onclick="removerAmizade('${amigo.uid}')">Remover</button>
          </div>
        `;
        friendsGrid.appendChild(card);
      });
    }

        paginaAtual++;
        renderizarAmigos();

    window.paginaAnterior = function () {

    window.pesquisarUsuarios = async function () {
      const texto = pesquisaAmigos.value.trim().toLowerCase();
      searchResults.innerHTML = "";

      if (texto.length < 2) return;

      const usersRef = collection(db, "users");
      const snap = await getDocs(usersRef);

      snap.forEach((docSnap) => {
        const user = docSnap.data();
        const jaSouEu = user.uid === usuarioAtual.uid;
        const jaEhAmigo = (dadosUsuario.amigos || []).includes(user.uid);
        const jaEnviei = (dadosUsuario.solicitacoesEnviadas || []).includes(user.uid);
        const bloqueei = (dadosUsuario.bloqueados || []).includes(user.uid);
        const meBloqueou = (user.bloqueados || []).includes(usuarioAtual.uid);
        const bateNome = user.nome?.toLowerCase().includes(texto);
        const bateEmail = user.email?.toLowerCase().includes(texto);

        if (!jaSouEu && !jaEhAmigo && !jaEnviei && !bloqueei && !meBloqueou && (bateNome || bateEmail)) {
          const item = document.createElement("div");
          item.className = "result-item";
          item.innerHTML = `
            <img src="${user.foto || placeholderFoto}" />
            <div>
              <strong>${user.nome}</strong><br />
              <small>${user.email}</small>

    async function enviarSolicitacao(idPessoa) {

    }

    window.aceitarSolicitacao = async function (idPessoa) {
      if (!usuarioAtual || !idPessoa) return;

      const meuRef = doc(db, "users", usuarioAtual.uid);
      const pessoaRef = doc(db, "users", idPessoa);

      const [meuSnap, pessoaSnap] = await Promise.all([
        getDoc(meuRef),
        getDoc(pessoaRef)
      ]);

      const meusDados = meuSnap.exists() ? meuSnap.data() : {};
      const dadosPessoa = pessoaSnap.exists() ? pessoaSnap.data() : {};

      const meusAmigosUnicos = [...new Set([...(meusDados.amigos || []), idPessoa])];
      const amigosPessoaUnicos = [...new Set([...(dadosPessoa.amigos || []), usuarioAtual.uid])];

      await updateDoc(meuRef, {
        amigos: meusAmigosUnicos,
        solicitacoesRecebidas: arrayRemove(idPessoa),
        solicitacoesEnviadas: arrayRemove(idPessoa)
      });

      await updateDoc(pessoaRef, {
        amigos: amigosPessoaUnicos,
        solicitacoesEnviadas: arrayRemove(usuarioAtual.uid),
        solicitacoesRecebidas: arrayRemove(usuarioAtual.uid)
      });

      await carregarUsuario();
    };

      await updateDoc(doc(db, "users", usuarioAtual.uid), {
        solicitacoesRecebidas: arrayRemove(idPessoa)

        bloqueados: arrayUnion(idPessoa),
        amigos: arrayRemove(idPessoa),
        solicitacoesRecebidas: arrayRemove(idPessoa),
        solicitacoesEnviadas: arrayRemove(idPessoa)
      });

      await updateDoc(doc(db, "users", idPessoa), {
        amigos: arrayRemove(usuarioAtual.uid),
        solicitacoesRecebidas: arrayRemove(usuarioAtual.uid),

    window.removerAmizade = async function (idPessoa) {
      if (!usuarioAtual || !idPessoa) return;

      const amigo = amigos.find((p) => p.uid === idPessoa);
      const nome = amigo?.nome || "esse amigo";
      const confirmar = confirm(`Remover ${nome} da sua lista de amigos?`);
      if (!confirmar) return;

      await updateDoc(doc(db, "users", usuarioAtual.uid), {
        amigos: arrayRemove(idPessoa)
      });

      await updateDoc(doc(db, "users", idPessoa), {
        amigos: arrayRemove(usuarioAtual.uid)

      if (amigoChat?.uid === idPessoa) {
        fecharChat();

      await carregarUsuario();

    window.fecharChat = function () {
      chatPanel.classList.add("hidden");
      messages.innerHTML = "";
      typingStatus.textContent = "";
      if (emojiPicker) emojiPicker.classList.add("hidden");
      if (unsubscribeMessages) {
        unsubscribeMessages();
        unsubscribeMessages = null;

      if (unsubscribeTyping) {
        unsubscribeTyping();
        unsubscribeTyping = null;
      }
      amigoChat = null;
      chatIdAtual = null;

    function gerarChatId(id1, id2) {
      return [id1, id2].sort().join("_");
    }

    window.abrirChat = async function (amigo) {
      amigoChat = amigo;
      chatIdAtual = gerarChatId(usuarioAtual.uid, amigo.uid);

      chatPanel.classList.remove("hidden");
      notificationsBox.classList.add("hidden");
      chatFoto.src = amigo.foto || placeholderFoto;
      chatNome.textContent = amigo.nome;
      messages.innerHTML = "";

      await updateDoc(doc(db, "users", usuarioAtual.uid), {
        unreadChats: arrayRemove(chatIdAtual)
      }).catch(() => {});

      await setDoc(doc(db, "chats", chatIdAtual), {
        participantes: [usuarioAtual.uid, amigo.uid]
      }, { merge: true });

      if (unsubscribeMessages) unsubscribeMessages();
      if (unsubscribeTyping) unsubscribeTyping();

      const mensagensRef = collection(db, "messages");

      // Consulta simples para não depender de índice composto do Firestore.
      // A organização por horário é feita aqui no navegador.
      const q = query(
        mensagensRef,
        where("chatId", "==", chatIdAtual)
      );

      unsubscribeMessages = onSnapshot(q, (snap) => {
        messages.innerHTML = "";

        const listaMensagens = [];

        snap.forEach((docSnap) => {
          listaMensagens.push({
            id: docSnap.id,
            ...docSnap.data()
          });
        });

        listaMensagens.sort((a, b) => {
          const tempoA = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
          const tempoB = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
          return tempoA - tempoB;
        });

        listaMensagens.forEach((msg) => {
          const minha = msg.senderId === usuarioAtual.uid;

          const row = document.createElement("div");
          row.className = "message-row " + (minha ? "mine-row" : "theirs-row");

          const avatar = document.createElement("img");
          avatar.className = "msg-avatar";
          avatar.alt = minha ? "Minha foto" : "Foto do amigo";
          avatar.src = minha
            ? (dadosUsuario.foto || placeholderFoto)
            : (amigoChat.foto || placeholderFoto);

          const div = document.createElement("div");
          div.className = "message " + (minha ? "mine" : "theirs");

          const tempo = msg.createdAt?.toDate ? msg.createdAt.toDate() : new Date();
          const podeApagar = minha && Date.now() - tempo.getTime() <= 7000;

          div.innerHTML = `
            <div>${msg.texto}</div>
            <small>${tempo.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</small>
            ${podeApagar ? `<button class="delete-msg">Apagar</button>` : ""}
          `;

          const botao = div.querySelector("button");
          if (botao) botao.onclick = () => apagarMensagem(msg.id, tempo);

          if (minha) {
            row.appendChild(div);
            row.appendChild(avatar);
          } else {
            row.appendChild(avatar);
            row.appendChild(div);
          }

          messages.appendChild(row);
        });

        messages.scrollTop = messages.scrollHeight;
      }, (error) => {
        messages.innerHTML = `<p style="color:red; padding:10px;">Erro ao carregar mensagens: ${error.message}</p>`;
      });

      unsubscribeTyping = onSnapshot(doc(db, "chats", chatIdAtual), (snap) => {
        const data = snap.data();
        const digitando = data?.digitando?.[amigo.uid];
        typingStatus.textContent = digitando ? `${amigo.nome} está digitando...` : "";
      });
    };

    window.alternarEmojiPicker = function () {
      emojiPicker.classList.toggle("hidden");
    };

    window.adicionarEmoji = function (emoji) {
      messageInput.value += emoji;
      messageInput.focus();
      marcarDigitando();
    };

    window.enviarMensagem = async function () {
      const texto = messageInput.value.trim();

      if (!texto) return;

      if (!chatIdAtual || !amigoChat || !usuarioAtual) {
        alert("Abra o chat de um amigo antes de enviar mensagem.");
        return;
      }

      try {
        const textoOriginal = texto;
        messageInput.value = "";

        await addDoc(collection(db, "messages"), {
          chatId: chatIdAtual,
          senderId: usuarioAtual.uid,
          receiverId: amigoChat.uid,
          texto: textoOriginal,
          createdAt: serverTimestamp()
        });

        emojiPicker.classList.add("hidden");
        await pararDigitando();
      } catch (error) {
        messageInput.value = texto;
        alert("Não foi possível enviar a mensagem: " + error.message);
      }
    };

    async function apagarMensagem(messageId, tempo) {
      if (Date.now() - tempo.getTime() > 7000) {
        alert("Só é possível apagar a mensagem em até 7 segundos.");
        return;
      }

      await deleteDoc(doc(db, "messages", messageId));
    }

    window.marcarDigitando = async function () {
      if (!chatIdAtual || !usuarioAtual) return;

      await setDoc(doc(db, "chats", chatIdAtual), {
        digitando: {
          [usuarioAtual.uid]: true
        }
      }, { merge: true });

      clearTimeout(typingTimer);
      typingTimer = setTimeout(pararDigitando, 1200);
    };

    async function pararDigitando() {
      if (!chatIdAtual || !usuarioAtual) return;

      await setDoc(doc(db, "chats", chatIdAtual), {
        digitando: {
          [usuarioAtual.uid]: false
        }
      }, { merge: true });
    }
  </script>
</body>
</html>
