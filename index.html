<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>abelhaKut</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="logo">🐝 abelhaKut</div>

  <div class="top-actions">
    <input type="text" placeholder="Pesquisar pessoas...">
    <button>🔔</button>
    <button>💬</button>

    <div class="profile-mini">
      <img src="https://via.placeholder.com/40x50">
      <span>Bruno</span>
    </div>
  </div>
</header>

<div class="layout">

  <aside class="sidebar">
    <button>🏠 Início</button>
    <button>👥 Amigos</button>
    <button>💬 Mensagens</button>
    <button>⚙️ Configurações</button>
  </aside>

  <main class="feed-area">

    <section class="create-post">
      <div class="create-top">
        <img src="https://via.placeholder.com/40x50">
        <input type="text" placeholder="O que você está pensando?">
      </div>

      <div class="create-actions">
        <button>📷 Foto</button>
        <button>😊 Emoji</button>
        <button>Publicar</button>
      </div>
    </section>

    <section class="post-card">
      <div class="post-header">
        <img src="https://via.placeholder.com/40x50">
        <div>
          <h3>Maria</h3>
          <small>Agora mesmo</small>
        </div>
      </div>

      <p>
        Primeira postagem do abelhaKut 🚀
      </p>

      <div class="post-actions">
        <button>❤️ Curtir</button>
        <button>💬 Comentários</button>
        <button>📤 Compartilhar</button>
      </div>
    </section>

  </main>

  <aside class="friends-panel">
    <h3>Amigos Online</h3>

    <div class="friend-mini">
      <img src="https://via.placeholder.com/35x45">
      <span>🟢 Ana</span>
    </div>

    <div class="friend-mini">
      <img src="https://via.placeholder.com/35x45">
      <span>🟢 João</span>
    </div>
  </aside>

</div>

<div class="chat-floating">
  <div class="chat-header">
    <span>Maria</span>
    <button>X</button>
  </div>

  <div class="chat-messages">
    <div class="msg theirs">Oi 👋</div>
    <div class="msg mine">Tudo bem?</div>
  </div>

  <div class="chat-input">
    <input type="text" placeholder="Digite...">
    <button>➤</button>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
